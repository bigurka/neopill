assumi_farmaco:
  name: Assumi farmaco
  description: Registra l'assunzione di una dose di un farmaco, scalando la scorta.
  fields:
    medication_id:
      name: Farmaco
      description: ID del farmaco.
      required: true
      selector:
        text:
    amount:
      name: Quantità
      description: Quantità assunta. Se omessa, viene usata la dose configurata per il farmaco.
      required: false
      selector:
        number:
          min: 0
          step: 0.25
          mode: box

segna_non_assunta:
  name: Segna come non assunta
  description: Dichiara che una dose pianificata non è stata assunta, senza scalare la scorta.
  fields:
    medication_id:
      name: Farmaco
      description: ID del farmaco.
      required: true
      selector:
        text:

rifornisci_farmaco:
  name: Rifornisci farmaco
  description: >-
    Aggiunge scorta a un farmaco, per quantità diretta oppure per numero di confezioni
    (usa la dimensione confezione configurata sul farmaco).
  fields:
    medication_id:
      name: Farmaco
      description: ID del farmaco.
      required: true
      selector:
        text:
    amount:
      name: Quantità
      description: Unità da aggiungere direttamente. Alternativa a "packages".
      required: false
      selector:
        number:
          min: 0
          step: 0.25
          mode: box
    packages:
      name: Confezioni
      description: Numero di confezioni da aggiungere. Alternativa a "amount".
      required: false
      selector:
        number:
          min: 0
          step: 1
          mode: box

segna_rifornimento_notificato:
  name: Segna rifornimento notificato
  description: >-
    Dichiara che è già stato notificato l'utente di uno o più farmaci da
    rifornire, così i loro attributi "da_notificare" (sul binary_sensor
    "low_stock" del farmaco, e in forma aggregata sul sensore
    "restock_reminder" del paziente) tornano a false finché la situazione
    non cambia. Passa "medication_id" per confermare un singolo farmaco
    (es. dopo un rifornimento parziale), oppure "patient_id" per confermarli
    tutti insieme per quel paziente. Da chiamare dalle proprie automazioni
    subito dopo aver notificato l'utente.
  fields:
    medication_id:
      name: Farmaco
      description: >-
        ID del farmaco da confermare da solo. Alternativa a "patient_id".
      required: false
      selector:
        text:
    patient_id:
      name: Paziente
      description: >-
        ID del paziente: conferma tutti i suoi farmaci attualmente da
        notificare. Alternativa a "medication_id". ID disponibile
        nell'attributo "patient_id" del sensore restock_reminder, o come
        "medication_id" di ogni voce nel suo attributo "farmaci".
      required: false
      selector:
        text:

correggi_assunzione:
  name: Correggi assunzione in non assunta
  description: >-
    Trasforma una dose già registrata come "assunta" in "non assunta",
    ripristinando la quantità di scorta che era stata scalata. Pensato per
    correggere un'azione massiva ("Assumi tutti") che ha incluso per errore
    un farmaco già a scorta zero, impossibile da deselezionare prima di
    confermare. L'ID evento arriva dalla notifica di scorta esaurita
    (evento "neopill_stock_depleted").
  fields:
    event_id:
      name: Evento
      description: ID dell'evento di assunzione da correggere.
      required: true
      selector:
        text:
